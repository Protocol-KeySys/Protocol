[package]
name = "protocol-keyserver"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.5"
rand = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
